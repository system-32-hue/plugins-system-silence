<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Silence Plugin Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">SS</div>

    <div class="brand">
        <h1>System Silence</h1>
        <span>Plugin Store</span>
    </div>

    <div class="account">
        <span id="userEmail"></span>

        <button
            id="loginButton"
            type="button"
            onclick="openLoginModal()"
        >
            Login
        </button>

        <button
            id="logoutButton"
            type="button"
            class="hidden"
        >
            Sair
        </button>
    </div>
</header>

<main>

    <section class="hero">
        <h2>Plugins da comunidade</h2>

        <p>
            Publique e instale plugins para o System Silence.
        </p>

        <button
            id="publishButton"
            type="button"
        >
            + Publicar plugin
        </button>
    </section>

    <section class="search">
        <input
            id="search"
            type="search"
            placeholder="Pesquisar plugins..."
            autocomplete="off"
        >
    </section>

    <section>

        <div class="titleRow">
            <h2>Plugins</h2>
            <span id="count">0 plugins</span>
        </div>

        <div id="plugins" class="plugins">
            <div class="loading">
                Carregando plugins...
            </div>
        </div>

    </section>

</main>

<div
    id="loginModal"
    class="modal hidden"
>

    <div class="modalBox">

        <button
            id="closeLogin"
            class="close"
            type="button"
            onclick="closeLoginModal()"
        >
            ×
        </button>

        <h2 id="authTitle">
            Login
        </h2>

        <form id="authForm">

            <label for="authEmail">
                Email
            </label>

            <input
                id="authEmail"
                type="email"
                autocomplete="email"
                required
            >

            <label for="authPassword">
                Senha
            </label>

            <input
                id="authPassword"
                type="password"
                autocomplete="current-password"
                minlength="6"
                required
            >

            <button
                id="authSubmit"
                class="publish"
                type="submit"
            >
                Entrar
            </button>

        </form>

        <button
            id="switchAuth"
            class="switchAuth"
            type="button"
        >
            Criar uma conta
        </button>

    </div>

</div>

<div
    id="publishModal"
    class="modal hidden"
>

    <div class="modalBox">

        <button
            id="closeModal"
            class="close"
            type="button"
            onclick="closePublishModal()"
        >
            ×
        </button>

        <h2>
            Publicar plugin
        </h2>

        <form id="pluginForm">

            <label for="pluginName">
                Nome
            </label>

            <input
                id="pluginName"
                type="text"
                maxlength="80"
                required
            >

            <label for="pluginDescription">
                Descrição
            </label>

            <textarea
                id="pluginDescription"
                maxlength="500"
                required
            ></textarea>

            <label for="pluginVersion">
                Versão
            </label>

            <input
                id="pluginVersion"
                type="text"
                value="1.0.0"
                required
            >

            <label for="pluginFile">
                Arquivo JavaScript
            </label>

            <input
                id="pluginFile"
                type="file"
                accept=".js"
                required
            >

            <button
                id="submitButton"
                class="publish"
                type="submit"
            >
                Publicar
            </button>

        </form>

    </div>

</div>

<div id="toast"></div>

<script src="app.js"></script>

</body>
</html>
