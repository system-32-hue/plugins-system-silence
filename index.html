<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Silence Plugins</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="brand">
        <div class="logo">SS</div>
        <div>
            <h1>System Silence</h1>
            <span>Plugin Store</span>
        </div>
    </div>

    <a
        class="github"
        href="https://github.com/system-32-hue/System-silence"
        target="_blank"
        rel="noopener"
    >
        GitHub
    </a>
</header>

<main>
    <section class="hero">
        <div class="badge">PLUGIN STORE</div>

        <h2>Plugins para<br>System Silence</h2>

        <p>
            Encontre, baixe e publique plugins JavaScript
            para o System Silence.
        </p>

        <input
            id="search"
            type="search"
            placeholder="Pesquisar plugins..."
            autocomplete="off"
        >
    </section>

    <section class="catalog">
        <div id="count" class="count"></div>
        <div id="plugins" class="grid"></div>
    </section>
</main>

<footer>
    <span>System Silence Plugin Store</span>
    <span>Powered by GitHub Pages</span>
</footer>

<script src="app.js"></script>

</body>
</html>
